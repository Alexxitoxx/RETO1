x-backend-environment: &backend-environment
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-reto1}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}

services:

  create-startup:
    build: ./services/startups/create
    environment: *backend-environment
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  read-startup:
    build: ./services/startups/read
    environment: *backend-environment
    expose:
      - "8003"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8003/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  update-startup:
    build: ./services/startups/update
    environment: *backend-environment
    expose:
      - "8004"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8004/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  delete-startup:
    build: ./services/startups/delete
    environment: *backend-environment
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  create-technology:
    build: ./services/technologies/create
    environment: *backend-environment
    expose:
      - "8005"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8005/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  read-technology:
    build: ./services/technologies/read
    environment: *backend-environment
    expose:
      - "8007"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8007/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  update-technology:
    build: ./services/technologies/update
    environment: *backend-environment
    expose:
      - "8008"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8008/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  delete-technology:
    build: ./services/technologies/delete
    environment: *backend-environment
    expose:
      - "8006"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8006/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: ./gateway
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/status | grep -q 'status' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      create-startup:
        condition: service_healthy
      read-startup:
        condition: service_healthy
      update-startup:
        condition: service_healthy
      delete-startup:
        condition: service_healthy
      create-technology:
        condition: service_healthy
      read-technology:
        condition: service_healthy
      update-technology:
        condition: service_healthy
      delete-technology:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/v2/api
    ports:
      - "5173:4173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4173"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      gateway:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-reto1}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reto1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql

volumes:
  postgres_data:
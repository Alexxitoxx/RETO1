events {}

http {

    map $http_origin $cors_origin {
        # Solo se permiten los orígenes locales usados por el frontend.
        default "";
        "http://localhost:3000" $http_origin;
        "http://localhost:3001" $http_origin;
        "http://localhost:5173" $http_origin;
    }

    server {
        listen 80;

        location = /status {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Vary "Origin" always;

        # Responde preflight sin enviar la petición al microservicio.
        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /v1/api/startups/create {
            proxy_pass http://create-startup:8001;
        }

        location = /v1/api/startups/read {
            proxy_pass http://read-startup:8003;
        }

        location /v1/api/startups/read/ {
            proxy_pass http://read-startup:8003;
        }

        location /v1/api/startups/update/ {
            proxy_pass http://update-startup:8004;
        }

        location /v1/api/startups/delete/ {
            proxy_pass http://delete-startup:8002;
        }

        location = /v1/api/technologies/create {
            proxy_pass http://create-technology:8005;
        }

        location = /v1/api/technologies/read {
            proxy_pass http://read-technology:8007;
        }

        location /v1/api/technologies/read/ {
            proxy_pass http://read-technology:8007;
        }

        location /v1/api/technologies/update/ {
            proxy_pass http://update-technology:8008;
        }

        location /v1/api/technologies/delete/ {
            proxy_pass http://delete-technology:8006;
        }

        location = /v2/api/startups/create {
            # El gateway solo enruta; no transforma ni valida lógica de negocio.
            proxy_pass http://create-startup:8001;
        }

        location = /v2/api/startups/read {
            proxy_pass http://read-startup:8003;
        }

        location /v2/api/startups/read/ {
            proxy_pass http://read-startup:8003;
        }

        location /v2/api/startups/update/ {
            proxy_pass http://update-startup:8004;
        }

        location /v2/api/startups/delete/ {
            proxy_pass http://delete-startup:8002;
        }

        location = /v2/api/technologies/create {
            proxy_pass http://create-technology:8005;
        }

        location = /v2/api/technologies/read {
            proxy_pass http://read-technology:8007;
        }

        location /v2/api/technologies/read/ {
            proxy_pass http://read-technology:8007;
        }

        location /v2/api/technologies/update/ {
            proxy_pass http://update-technology:8008;
        }

        location /v2/api/technologies/delete/ {
            proxy_pass http://delete-technology:8006;
        }
    }
}